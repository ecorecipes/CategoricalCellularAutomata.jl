name = "categorical_cellular_automata_proofs"
defaultTargets = ["CategoricalCellularAutomataProofs"]
# One dependency checkout (Mathlib, about 7 GB) shared by the workspace's proofs/ projects.
packagesDir = "../../.lake-packages"

# mdgen turns the `/-! ... -/` module docs into Markdown (`make mdgen`). Pinned to the tag matching
# the toolchain. Listed before mathlib: Lake lets the last `require` win, so Mathlib's pins take
# precedence and `lake exe cache get` computes the right hashes.
[[require]]
name = "mdgen"
git = "https://github.com/Seasawher/mdgen"
rev = "v4.30.0"

# Mathlib at the toolchain's tag (Lean v4.30.0), so that `lake exe cache get` fetches prebuilt
# .oleans.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "CategoricalCellularAutomataProofs"
